<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Yuan Fang">
  <title>Yuan Fang</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    body {
      width: 66.6667%;
      margin: 48px auto;
      font: 12pt/1.5 Helvetica, Arial, sans-serif;
      color: #444;
      background: #fefefe;
    }

    #profile {
      display: flex;
      align-items: flex-start;
      gap: 5%;
    }

    #profile img {
      display: block;
      width: 30%;
      max-width: 100%;
      height: auto;
      flex-shrink: 0;
    }

    #profile-intro {
      flex: 1;
      min-width: 0;
    }

    .advisors {
      display: inline-block;
      max-width: 100%;
    }

    .advisor {
      white-space: nowrap;
    }

    h1 {
      margin: 0 0 0.5em;
      font-size: 40px;
      font-weight: normal;
      line-height: 1.5;
      color: #111;
    }

    p {
      margin: 1em 0;
    }

    a {
      color: #0645ad;
      text-decoration: none;
    }

    a:hover {
      color: #06e;
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      body {
        width: auto;
        margin: 24px 20px;
      }

      #profile {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      #profile img {
        width: 240px;
      }
    }
  </style>
</head>
<body>
  <main id="profile">
    <div id="profile-intro">
      <h1>Yuan Fang <span lang="zh">方圆</span></h1>
      <p>I am a first-year Ph.D. student at Columbia, as part of the <a href="https://cail.columbia.edu/">Columbia Core AI Lab (CAIL)</a>, advised by <span class="advisors"><a class="advisor" href="https://yunzhuli.github.io/">Yunzhu Li</a> and <a class="advisor" href="https://www.cs.columbia.edu/~cxz/">Changxi Zheng</a></span>. I work on robotics.</p>
      <p>Before that, I completed my undergraduate studies at Shanghai Jiao Tong University.</p>
      <p>Email: yf2716 at columbia dot edu</p>
    </div>
    <img src="assets/profile/IMG_2568.jpg" alt="Yuan Fang" width="1477" height="2000">
  </main>
</body>
</html>
