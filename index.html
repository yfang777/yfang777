<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Yuan Fang">
  <title>Yuan Fang</title>
  <style>
    body {
      width: 66.6667%;
      margin: 48px auto;
      font: 24px/1.5 Georgia, Palatino, 'Palatino Linotype', Times, 'Times New Roman', serif;
      color: #444;
      background: #fefefe;
    }

    #profile {
      display: flex;
      align-items: flex-start;
      gap: 5%;
    }

    #profile img {
      display: block;
      width: 30%;
      max-width: 100%;
      height: auto;
      flex-shrink: 0;
    }

    #profile-intro {
      flex: 1;
      min-width: 0;
    }

    h1 {
      margin: 0 0 0.5em;
      font-size: 40px;
      font-weight: normal;
      line-height: 1.5;
      color: #111;
    }

    p {
      margin: 1em 0;
    }

    a {
      color: #0645ad;
      text-decoration: none;
    }

    a:hover {
      color: #06e;
      text-decoration: underline;
    }

    @media (max-width: 760px) {
      body {
        width: auto;
        margin: 24px 20px;
      }

      #profile {
        flex-direction: column;
        align-items: flex-start;
        gap: 20px;
      }

      #profile img {
        width: 240px;
      }
    }
  </style>
</head>
<body>
  <main id="profile">
    <div id="profile-intro">
      <h1>Yuan Fang</h1>
      <p>I am a PhD student in Computer Science at Columbia University advised by <a href="https://yunzhuli.github.io/">Yunzhu Li</a>.</p>
      <p>Currently, I work on robotics, with an emphasis on sim-to-real. Before that, I completed my undergraduate studies at Shanghai Jiao Tong University.</p>
      <p>Email: yf2716 at columbia dot edu</p>
    </div>
    <img src="assets/profile/IMG_2568.jpg" alt="Yuan Fang" width="1477" height="2000">
  </main>
</body>
</html>
